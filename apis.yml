description: Bluestone Lane is an Australian‑origin coffee brand operating cafés across the United States. It offers ethically‑sourced, meticulously‑roasted
  coffee beans, a subscription service, wholesale programs, and a loyalty app that rewards frequent customers. The company emphasizes sustainable
  packaging, community‑centric café experiences, and corporate coffee solutions for businesses. While it runs a robust retail e‑commerce site
  and provides corporate coffee services, it does not currently expose a public API for external developers. The brand focuses on quality, sustainability,
  and a distinctive Australian café culture brought to American neighborhoods.
